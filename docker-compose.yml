service:
  # menambahkan service postgre
  postgre-db:
    image: postgres:16-alpine
    container_name: harkat_postgre_container
    restart: always
    environment:
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: adiadiadi
      POSTGRE_DB: FrameworkDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postresql/data

volume:
  postgres_data_volume: